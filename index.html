<script>
// Укажите свои названия, пути к видео и кодовые слова.
// В этой браузерной версии кодовые слова видны в исходном коде.
const lessons = [
  {
    title: 'Первое видео',
    src: 'videos/lesson-1.mp4',
    code: 'старт'
  },
  {
    title: 'Второе видео',
    src: 'videos/lesson-2.mp4',
    code: 'знания'
  },
  {
    title: 'Третье видео',
    src: 'videos/lesson-3.mp4',
    code: 'практика'
  },
  {
    title: 'Четвёртое видео',
    src: 'videos/lesson-4.mp4',
    code: 'развитие'
  },
  {
    title: 'Пятое видео',
    src: 'videos/lesson-5.mp4',
    code: 'финиш'
  }
];

// Новый ключ, чтобы старое состояние прототипа не мешало проверке.
const storageKey = 'video-course-demo-v2';

let state = { passed: 0 };

try {
  const saved = JSON.parse(localStorage.getItem(storageKey));

  if (
    saved &&
    Number.isInteger(saved.passed) &&
    saved.passed >= 0 &&
    saved.passed <= lessons.length
  ) {
    state.passed = saved.passed;
  }
} catch (error) {
  // Если сохранение недоступно, сайт работает без него.
}

function saveProgress() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch (error) {
    // Прогресс останется доступным до перезагрузки страницы.
  }
}

function normalizeCode(value) {
  return value
    .trim()
    .toLocaleLowerCase('ru-RU')
    .normalize('NFC');
}

const grid = document.querySelector('#grid');
const players = [];
const updateCards = [];

grid.replaceChildren();

lessons.forEach((lesson, index) => {
  const card = document.createElement('article');
  card.className = 'card';

  card.innerHTML = `
    <h2></h2>

    <div class="screen"></div>

    <div class="controls"></div>

    <form>
      <input
        type="text"
        aria-label="Кодовое слово"
        placeholder="Кодовое слово"
        autocomplete="off"
        required
      >
      <button type="submit">OK</button>
    </form>

    <p class="status" role="status" aria-live="polite"></p>
  `;

  card.querySelector('h2').textContent = lesson.title;
  grid.append(card);

  const screen = card.querySelector('.screen');
  const controls = card.querySelector('.controls');
  const form = card.querySelector('form');
  const input = form.querySelector('input');
  const submit = form.querySelector('button');
  const status = card.querySelector('.status');

  let video = null;
  let allowedTime = 0;
  let correctingSeek = false;
  let lastUpdate = performance.now();

  function updateCard() {
    const locked = index > state.passed;
    const passed = index < state.passed;

    // Поле доступно сразу для текущего урока.
    // Просмотр до конца НЕ требуется.
    input.disabled = locked || passed;
    submit.disabled = locked || passed;

    status.classList.toggle('done', passed);

    if (locked) {
      screen.innerHTML = `
        <div
          class="lock"
          role="img"
          aria-label="Видео заблокировано"
        ></div>
      `;

      status.textContent =
        'Введите правильное кодовое слово в предыдущем уроке.';
      return;
    }

    status.textContent = passed
      ? 'Урок пройден.'
      : 'Введите кодовое слово из видео, чтобы открыть следующий урок.';

    if (!video && !screen.querySelector('button')) {
      const launch = document.createElement('button');

      launch.type = 'button';
      launch.className = 'launch';
      launch.textContent = '▶';
      launch.setAttribute(
        'aria-label',
        'Смотреть: ' + lesson.title
      );

      launch.addEventListener('click', mountPlayer);
      screen.replaceChildren(launch);
    }

    if (state.passed === lessons.length && index === lessons.length - 1) {
      status.textContent = 'Все уроки пройдены!';
    }
  }

  function mountPlayer() {
    if (video) return;

    video = document.createElement('video');
    video.preload = 'metadata';
    video.playsInline = true;
    video.controls = false;
    video.disablePictureInPicture = true;

    video.setAttribute('disableremoteplayback', '');
    video.setAttribute('controlslist', 'nodownload noremoteplayback');
    video.src = lesson.src;

    screen.replaceChildren(video);
    players.push(video);

    controls.innerHTML = `
      <button
        type="button"
        aria-label="Воспроизвести или приостановить"
      >
        Смотреть
      </button>

      <label>
        Звук
        <input
          type="range"
          aria-label="Громкость"
          min="0"
          max="1"
          step="0.05"
          value="1"
        >
      </label>

      <select aria-label="Скорость">
        <option value="0.75">0,75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option>
        <option value="2">2×</option>
      </select>
    `;

    const toggle = controls.querySelector('button');
    const volume = controls.querySelector('input');
    const speed = controls.querySelector('select');

    function playVideo() {
      // Повторный просмотр начинается с начала.
      if (video.ended) {
        allowedTime = 0;
        correctingSeek = true;
        video.currentTime = 0;
      }

      lastUpdate = performance.now();

      video.play().catch(() => {
        status.textContent =
          'Не удалось запустить видео. Проверьте файл и нажмите «Смотреть».';
      });
    }

    function togglePlayback() {
      if (video.paused) {
        playVideo();
      } else {
        video.pause();
      }
    }

    toggle.addEventListener('click', togglePlayback);
    video.addEventListener('click', togglePlayback);

    volume.addEventListener('input', () => {
      video.volume = Number(volume.value);
    });

    speed.addEventListener('change', () => {
      video.playbackRate = Number(speed.value);
      lastUpdate = performance.now();
    });

    video.addEventListener('play', () => {
      // Одновременно воспроизводится только одно видео.
      players.forEach((player) => {
        if (player !== video) {
          player.pause();
        }
      });

      toggle.textContent = 'Пауза';
      lastUpdate = performance.now();
    });

    video.addEventListener('pause', () => {
      toggle.textContent = 'Смотреть';
    });

    video.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    // Возвращаем позицию при попытке перемотки.
    video.addEventListener('seeking', () => {
      if (
        !correctingSeek &&
        Math.abs(video.currentTime - allowedTime) > 0.35
      ) {
        correctingSeek = true;
        video.currentTime = allowedTime;
      }
    });

    video.addEventListener('seeked', () => {
      correctingSeek = false;
      lastUpdate = performance.now();
    });

    video.addEventListener('timeupdate', () => {
      const now = performance.now();
      const elapsed = (now - lastUpdate) / 1000;
      lastUpdate = now;

      if (correctingSeek || video.seeking) return;

      const maximumExpectedTime =
        allowedTime + elapsed * video.playbackRate + 0.7;

      if (video.currentTime > maximumExpectedTime) {
        correctingSeek = true;
        video.currentTime = allowedTime;
        return;
      }

      allowedTime = Math.max(allowedTime, video.currentTime);
    });

    video.addEventListener('ended', () => {
      toggle.textContent = 'Смотреть';

      // Окончание видео ничего НЕ разблокирует.
      if (index === state.passed) {
        status.textContent =
          'Видео закончилось. Введите кодовое слово, чтобы открыть следующий урок.';
      }
    });

    video.addEventListener('error', () => {
      status.textContent =
        'Видео не найдено или формат не поддерживается. Проверьте путь: ' +
        lesson.src;
    });

    playVideo();
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();

    // Принимаем код только от текущего доступного урока.
    if (index !== state.passed) return;

    const enteredCode = normalizeCode(input.value);
    const correctCode = normalizeCode(lesson.code);

    if (enteredCode !== correctCode) {
      status.textContent =
        'Неверное кодовое слово. Попробуйте ещё раз.';
      input.focus();
      return;
    }

    // Только правильное кодовое слово открывает следующий урок.
    state.passed = index + 1;
    saveProgress();

    input.value = '';

    updateCards.forEach((update) => update());
  });

  updateCards.push(updateCard);
});

updateCards.forEach((update) => update());
</script>
