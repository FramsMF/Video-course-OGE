<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Видеоуроки</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #39535d;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1120px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #637a83;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 36px 28px;
      align-items: start;
    }

    .card {
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 1.3;
    }

    .screen {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #b7d5db;
      border-radius: 4px;
    }

    .launch {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .play-icon {
      width: 0;
      height: 0;
      margin-left: 12px;
      border-top: 35px solid transparent;
      border-bottom: 35px solid transparent;
      border-left: 65px solid #39535d;
    }

    .lock {
      position: relative;
      width: 70px;
      height: 55px;
      margin-top: 30px;
      background: #39535d;
    }

    .lock::before {
      position: absolute;
      left: 0;
      bottom: 42px;
      width: 70px;
      height: 65px;
      border: 12px solid #39535d;
      border-bottom: 0;
      border-radius: 42px 42px 0 0;
      content: "";
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #18292f;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    select {
      padding: 8px;
      color: #39535d;
      background: #fff;
      border: 1px solid #91abb6;
      border-radius: 4px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      background: #edf5f7;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 3px solid #75b5c5;
      outline-offset: 2px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .controls:not(:empty) {
      margin-top: 10px;
    }

    .volume-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
    }

    .volume-label input {
      width: 65px;
    }

    .code-form {
      display: flex;
      gap: 7px;
      margin-top: 16px;
    }

    .code-input {
      display: block;
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 10px;
      color: #304a55;
      background: #fff;
      border: 2px solid #7c99a7;
      border-radius: 0;
      pointer-events: auto;
      user-select: text;
      opacity: 1;
    }

    .code-input::placeholder {
      color: #91a8ae;
    }

    .status {
      min-height: 42px;
      margin: 10px 0 0;
      color: #647b84;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.success {
      color: #28744e;
    }

    .status.error {
      color: #ae3636;
    }

    .footer {
      margin-top: 35px;
      color: #71858d;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      .page {
        margin: 24px auto;
        padding: 0 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>Видеоуроки</h1>
      <p>
        Кодовое слово из просмотренного урока вводите
        в поле под следующим видео, чтобы открыть его.
      </p>
    </header>

    <div class="grid" id="grid"></div>

    <noscript>
      Для работы видеокурса необходимо включить JavaScript.
    </noscript>

    <footer class="footer">
      Прогресс сохраняется в этом браузере.
      Поля кодовых слов доступны для ввода независимо
      от продолжительности просмотра.
    </footer>
  </main>

  <script>
    // code — слово из этого видео,
    // которое нужно ввести ПОД СЛЕДУЮЩИМ видео.
    const lessons = [
      {
        title: 'Первое видео',
        src: 'videos/lesson-1.mp4',
        code: 'старт'
      },
      {
        title: 'Второе видео',
        src: 'videos/lesson-2.mp4',
        code: 'знания'
      },
      {
        title: 'Третье видео',
        src: 'videos/lesson-3.mp4',
        code: 'практика'
      },
      {
        title: 'Четвёртое видео',
        src: 'videos/lesson-4.mp4',
        code: 'развитие'
      },
      {
        title: 'Пятое видео',
        src: 'videos/lesson-5.mp4',
        code: ''
      }
    ];

    const STORAGE_KEY = 'video-course-full-page-v5';

    let unlockedIndex = 0;

    try {
      const saved = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      );

      if (
        saved &&
        Number.isInteger(saved.unlockedIndex) &&
        saved.unlockedIndex >= 0 &&
        saved.unlockedIndex < lessons.length
      ) {
        unlockedIndex = saved.unlockedIndex;
      }
    } catch (error) {
      // Страница работает и без localStorage.
    }

    function saveProgress() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({ unlockedIndex })
        );
      } catch (error) {
        // Не прерываем работу при ошибке сохранения.
      }
    }

    function normalize(value) {
      return String(value)
        .trim()
        .toLocaleLowerCase('ru-RU')
        .normalize('NFC');
    }

    const grid = document.getElementById('grid');
    const cards = [];
    const players = [];

    lessons.forEach((lesson, index) => {
      const card = document.createElement('article');
      card.className = 'card';

      card.innerHTML = `
        <h2></h2>

        <div class="screen"></div>

        <div class="controls"></div>

        <p class="status" role="status" aria-live="polite"></p>
      `;

      const title = card.querySelector('h2');
      const screen = card.querySelector('.screen');
      const controls = card.querySelector('.controls');
      const status = card.querySelector('.status');

      title.textContent = lesson.title;

      let input = null;
      let video = null;

      function setStatus(text, type = '') {
        status.textContent = text;
        status.className = 'status';

        if (type) {
          status.classList.add(type);
        }
      }

      // Под первым видео поля нет.
      // Под остальными поля создаются сразу и никогда не блокируются.
      if (index > 0) {
        const form = document.createElement('form');
        form.className = 'code-form';

        input = document.createElement('input');
        input.type = 'text';
        input.className = 'code-input';
        input.placeholder = 'Кодовое слово';
        input.autocomplete = 'off';
        input.required = true;

        input.setAttribute(
          'aria-label',
          'Код для открытия видео: ' + lesson.title
        );

        const submit = document.createElement('button');
        submit.type = 'submit';
        submit.textContent = 'Открыть';

        form.append(input, submit);
        card.insertBefore(form, status);

        form.addEventListener('submit', (event) => {
          event.preventDefault();

          if (index <= unlockedIndex) {
            setStatus('Это видео уже открыто.', 'success');
            return;
          }

          if (index !== unlockedIndex + 1) {
            setStatus(
              'Сначала откройте предыдущее видео.',
              'error'
            );
            return;
          }

          const expected = normalize(
            lessons[index - 1].code
          );

          const entered = normalize(input.value);

          if (!expected) {
            setStatus(
              'Не настроено кодовое слово предыдущего урока.',
              'error'
            );
            return;
          }

          if (entered !== expected) {
            setStatus(
              'Неверное кодовое слово. Попробуйте ещё раз.',
              'error'
            );

            input.focus();
            return;
          }

          unlockedIndex = index;
          saveProgress();

          input.value = '';

          cards.forEach((item) => item.update());
        });
      }

      function update() {
        const unlocked = index <= unlockedIndex;

        if (unlocked) {
          if (!video && !screen.querySelector('.launch')) {
            const launch = document.createElement('button');

            launch.type = 'button';
            launch.className = 'launch';

            launch.setAttribute(
              'aria-label',
              'Смотреть: ' + lesson.title
            );

            launch.innerHTML =
              '<span class="play-icon" aria-hidden="true"></span>';

            launch.addEventListener('click', mountPlayer);

            screen.replaceChildren(launch);
          }

          setStatus(
            index === 0
              ? 'Видео доступно для просмотра.'
              : 'Видео открыто.',
            'success'
          );
        } else {
          screen.innerHTML = `
            <div
              class="lock"
              role="img"
              aria-label="Видео заблокировано"
            ></div>
          `;

          setStatus(
            'Введите код из видео «' +
            lessons[index - 1].title +
            '».'
          );
        }
      }

      function mountPlayer() {
        if (video || index > unlockedIndex) return;

        video = document.createElement('video');
        video.src = lesson.src;
        video.preload = 'metadata';
        video.playsInline = true;
        video.controls = false;
        video.disablePictureInPicture = true;

        video.setAttribute('disableremoteplayback', '');

        screen.replaceChildren(video);
        players.push(video);

        controls.innerHTML = `
          <button type="button">Смотреть</button>

          <label class="volume-label">
            Звук
            <input
              type="range"
              aria-label="Громкость"
              min="0"
              max="1"
              step="0.05"
              value="1"
            >
          </label>

          <select aria-label="Скорость воспроизведения">
            <option value="0.75">0,75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1,25×</option>
            <option value="1.5">1,5×</option>
            <option value="2">2×</option>
          </select>
        `;

        const playButton = controls.querySelector('button');
        const volume = controls.querySelector('input');
        const speed = controls.querySelector('select');

        let allowedTime = 0;
        let correctingSeek = false;
        let lastUpdate = performance.now();

        function play() {
          if (video.ended) {
            allowedTime = 0;
            correctingSeek = true;
            video.currentTime = 0;
          }

          lastUpdate = performance.now();

          video.play().catch(() => {
            setStatus(
              'Не удалось запустить видео. Проверьте файл: ' +
              lesson.src,
              'error'
            );
          });
        }

        function togglePlayback() {
          if (video.paused) {
            play();
          } else {
            video.pause();
          }
        }

        playButton.addEventListener('click', togglePlayback);
        video.addEventListener('click', togglePlayback);

        volume.addEventListener('input', () => {
          video.volume = Number(volume.value);
        });

        speed.addEventListener('change', () => {
          video.playbackRate = Number(speed.value);
          lastUpdate = performance.now();
        });

        video.addEventListener('play', () => {
          players.forEach((player) => {
            if (player !== video) {
              player.pause();
            }
          });

          playButton.textContent = 'Пауза';
          lastUpdate = performance.now();
        });

        video.addEventListener('pause', () => {
          playButton.textContent = 'Смотреть';
        });

        video.addEventListener('contextmenu', (event) => {
          event.preventDefault();
        });

        // Ограничение перемотки в браузерном интерфейсе.
        video.addEventListener('seeking', () => {
          if (
            !correctingSeek &&
            Math.abs(video.currentTime - allowedTime) > 0.35
          ) {
            correctingSeek = true;
            video.currentTime = allowedTime;
          }
        });

        video.addEventListener('seeked', () => {
          correctingSeek = false;
          lastUpdate = performance.now();
        });

        video.addEventListener('timeupdate', () => {
          const now = performance.now();
          const elapsed = (now - lastUpdate) / 1000;

          lastUpdate = now;

          if (correctingSeek || video.seeking) return;

          const expectedMaximum =
            allowedTime + elapsed * video.playbackRate + 0.7;

          if (video.currentTime > expectedMaximum) {
            correctingSeek = true;
            video.currentTime = allowedTime;
            return;
          }

          allowedTime = Math.max(
            allowedTime,
            video.currentTime
          );
        });

        video.addEventListener('ended', () => {
          playButton.textContent = 'Смотреть';

          // Здесь нет изменения unlockedIndex.
          // Сам просмотр ничего не открывает.
          if (index < lessons.length - 1) {
            setStatus(
              'Код из этого видео вводится в поле под следующим.'
            );
          } else {
            setStatus('Последнее видео завершено.', 'success');
          }
        });

        video.addEventListener('error', () => {
          setStatus(
            'Видео не найдено или формат не поддерживается: ' +
            lesson.src,
            'error'
          );
        });

        play();
      }

      grid.append(card);
      cards.push({ update });
    });

    cards.forEach((card) => card.update());
  </script>
</body>
</html>
