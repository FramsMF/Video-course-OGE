<script>
const lessons = [
  {
    title: 'Первое видео',
    src: 'videos/lesson-1.mp4',

    // Слово ИЗ первого видео.
    // Его нужно ввести ПОД вторым видео.
    code: 'старт'
  },
  {
    title: 'Второе видео',
    src: 'videos/lesson-2.mp4',

    // Слово из второго видео вводится под третьим.
    code: 'знания'
  },
  {
    title: 'Третье видео',
    src: 'videos/lesson-3.mp4',
    code: 'практика'
  },
  {
    title: 'Четвёртое видео',
    src: 'videos/lesson-4.mp4',
    code: 'развитие'
  },
  {
    title: 'Пятое видео',
    src: 'videos/lesson-5.mp4',

    // Последнее видео ничего дальше не открывает.
    code: ''
  }
];

const STORAGE_KEY = 'video-course-next-field-v3';

// Индекс последнего открытого видео.
// 0 означает, что открыто только первое.
let unlockedIndex = 0;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

  if (
    saved &&
    Number.isInteger(saved.unlockedIndex) &&
    saved.unlockedIndex >= 0 &&
    saved.unlockedIndex < lessons.length
  ) {
    unlockedIndex = saved.unlockedIndex;
  }
} catch (error) {
  // Если localStorage недоступен, работаем без сохранения.
}

function saveProgress() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({ unlockedIndex })
    );
  } catch (error) {
    // Сохранение не обязательно для работы страницы.
  }
}

function normalize(value) {
  return String(value)
    .trim()
    .toLocaleLowerCase('ru-RU')
    .normalize('NFC');
}

const grid = document.getElementById('grid');

if (!grid) {
  throw new Error('Не найден контейнер с id="grid".');
}

grid.replaceChildren();

const cards = [];
const players = [];

lessons.forEach((lesson, index) => {
  const card = document.createElement('article');
  card.className = 'card';

  card.innerHTML = `
    <h2></h2>

    <div class="screen"></div>

    <div class="controls"></div>

    <form>
      <input
        type="text"
        placeholder="Кодовое слово"
        autocomplete="off"
        required
      >
      <button type="submit">Открыть</button>
    </form>

    <p
      class="status"
      role="status"
      aria-live="polite"
    ></p>
  `;

  grid.append(card);

  const title = card.querySelector('h2');
  const screen = card.querySelector('.screen');
  const controls = card.querySelector('.controls');
  const form = card.querySelector('form');
  const input = form.querySelector('input');
  const submit = form.querySelector('button');
  const status = card.querySelector('.status');

  title.textContent = lesson.title;

  input.setAttribute(
    'aria-label',
    `Кодовое слово для открытия: ${lesson.title}`
  );

  let video = null;

  function createLaunchButton() {
    if (video || screen.querySelector('.launch')) return;

    const button = document.createElement('button');

    button.type = 'button';
    button.className = 'launch';
    button.textContent = '▶';

    button.setAttribute(
      'aria-label',
      'Смотреть: ' + lesson.title
    );

    button.addEventListener('click', mountPlayer);

    screen.replaceChildren(button);
  }

  function update() {
    const isUnlocked = index <= unlockedIndex;

    // Поле под следующим закрытым видео уже активно.
    const canEnterCode = index === unlockedIndex + 1;

    if (isUnlocked) {
      createLaunchButton();
    } else {
      screen.innerHTML = `
        <div
          class="lock"
          role="img"
          aria-label="Видео заблокировано"
        ></div>
      `;
    }

    // Под первым видео поле не требуется.
    form.hidden = index === 0;

    // Явно задаём display, чтобы существующие стили form
    // не переопределили скрытие первого поля.
    form.style.display = index === 0 ? 'none' : 'flex';

    input.disabled = !canEnterCode;
    submit.disabled = !canEnterCode;

    status.classList.toggle('done', isUnlocked);

    if (index === 0) {
      status.textContent = 'Видео доступно для просмотра.';
    } else if (isUnlocked) {
      status.textContent = 'Видео открыто.';
      input.value = '';
      input.placeholder = 'Видео уже открыто';
    } else if (canEnterCode) {
      input.placeholder = 'Код из предыдущего видео';

      status.textContent =
        'Введите слово из видео «' +
        lessons[index - 1].title +
        '», чтобы открыть этот урок.';
    } else {
      input.placeholder = 'Кодовое слово';

      status.textContent =
        'Поле станет доступно после открытия предыдущего видео.';
    }
  }

  function mountPlayer() {
    if (video || index > unlockedIndex) return;

    video = document.createElement('video');
    video.src = lesson.src;
    video.preload = 'metadata';
    video.playsInline = true;
    video.controls = false;
    video.disablePictureInPicture = true;

    video.setAttribute('disableremoteplayback', '');
    video.setAttribute(
      'controlslist',
      'nodownload noremoteplayback'
    );

    screen.replaceChildren(video);
    players.push(video);

    controls.innerHTML = `
      <button type="button">Смотреть</button>

      <label>
        Звук
        <input
          type="range"
          aria-label="Громкость"
          min="0"
          max="1"
          step="0.05"
          value="1"
        >
      </label>

      <select aria-label="Скорость воспроизведения">
        <option value="0.75">0,75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option>
        <option value="2">2×</option>
      </select>
    `;

    const playButton = controls.querySelector('button');
    const volume = controls.querySelector('input');
    const speed = controls.querySelector('select');

    let allowedTime = 0;
    let correctingSeek = false;
    let lastUpdate = performance.now();

    function play() {
      if (video.ended) {
        allowedTime = 0;
        correctingSeek = true;
        video.currentTime = 0;
      }

      lastUpdate = performance.now();

      video.play().catch(() => {
        status.textContent =
          'Не удалось запустить видео. Проверьте файл: ' +
          lesson.src;
      });
    }

    function togglePlayback() {
      if (video.paused) {
        play();
      } else {
        video.pause();
      }
    }

    playButton.addEventListener('click', togglePlayback);
    video.addEventListener('click', togglePlayback);

    volume.addEventListener('input', () => {
      video.volume = Number(volume.value);
    });

    speed.addEventListener('change', () => {
      video.playbackRate = Number(speed.value);
      lastUpdate = performance.now();
    });

    video.addEventListener('play', () => {
      players.forEach((otherVideo) => {
        if (otherVideo !== video) {
          otherVideo.pause();
        }
      });

      playButton.textContent = 'Пауза';
      lastUpdate = performance.now();
    });

    video.addEventListener('pause', () => {
      playButton.textContent = 'Смотреть';
    });

    video.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    // Блокировка обычных попыток перемотки.
    video.addEventListener('seeking', () => {
      if (
        !correctingSeek &&
        Math.abs(video.currentTime - allowedTime) > 0.35
      ) {
        correctingSeek = true;
        video.currentTime = allowedTime;
      }
    });

    video.addEventListener('seeked', () => {
      correctingSeek = false;
      lastUpdate = performance.now();
    });

    video.addEventListener('timeupdate', () => {
      const now = performance.now();
      const elapsed = (now - lastUpdate) / 1000;

      lastUpdate = now;

      if (correctingSeek || video.seeking) return;

      const expectedMaximum =
        allowedTime + elapsed * video.playbackRate + 0.7;

      if (video.currentTime > expectedMaximum) {
        correctingSeek = true;
        video.currentTime = allowedTime;
        return;
      }

      allowedTime = Math.max(allowedTime, video.currentTime);
    });

    video.addEventListener('ended', () => {
      playButton.textContent = 'Смотреть';

      // Завершение просмотра не открывает следующие уроки.
      if (
        index === unlockedIndex &&
        index < lessons.length - 1
      ) {
        status.textContent =
          'Введите кодовое слово в поле под следующим видео.';
      }
    });

    video.addEventListener('error', () => {
      status.textContent =
        'Видео не найдено или формат не поддерживается: ' +
        lesson.src;
    });

    play();
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();

    // Проверяем только поле под ближайшим закрытым видео.
    if (index === 0 || index !== unlockedIndex + 1) {
      return;
    }

    // Для открытия ЭТОГО видео нужен код из ПРЕДЫДУЩЕГО.
    const expectedCode = normalize(lessons[index - 1].code);
    const enteredCode = normalize(input.value);

    if (!expectedCode) {
      status.textContent =
        'Не настроено кодовое слово предыдущего видео.';
      return;
    }

    if (enteredCode !== expectedCode) {
      status.textContent =
        'Неверное слово. Введите код из предыдущего видео.';
      input.focus();
      return;
    }

    unlockedIndex = index;
    saveProgress();

    input.value = '';

    cards.forEach((item) => item.update());
  });

  cards.push({ update });
});

cards.forEach((card) => card.update());
</script>
