<script>
// Настройки видео.
// code — слово В ЭТОМ видео, которое открывает СЛЕДУЮЩЕЕ.
const lessons = [
  {
    title: 'Первое видео',
    src: 'videos/lesson-1.mp4',
    code: 'старт'
  },
  {
    title: 'Второе видео',
    src: 'videos/lesson-2.mp4',
    code: 'знания'
  },
  {
    title: 'Третье видео',
    src: 'videos/lesson-3.mp4',
    code: 'практика'
  },
  {
    title: 'Четвёртое видео',
    src: 'videos/lesson-4.mp4',
    code: 'развитие'
  },
  {
    title: 'Пятое видео',
    src: 'videos/lesson-5.mp4',
    code: ''
  }
];

const STORAGE_KEY = 'video-course-always-active-v4';

// Первое видео открыто сразу.
let unlockedIndex = 0;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

  if (
    saved &&
    Number.isInteger(saved.unlockedIndex) &&
    saved.unlockedIndex >= 0 &&
    saved.unlockedIndex < lessons.length
  ) {
    unlockedIndex = saved.unlockedIndex;
  }
} catch (error) {
  // При недоступном хранилище работаем без сохранения.
}

function saveProgress() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({ unlockedIndex })
    );
  } catch (error) {
    // Прогресс сохранится только до перезагрузки.
  }
}

function normalize(value) {
  return String(value)
    .trim()
    .toLocaleLowerCase('ru-RU')
    .normalize('NFC');
}

function initCourse() {
  const grid = document.getElementById('grid');

  if (!grid) {
    console.error('Не найден контейнер <div id="grid"></div>.');
    return;
  }

  grid.replaceChildren();

  const cards = [];
  const players = [];

  lessons.forEach((lesson, index) => {
    const card = document.createElement('article');
    card.className = 'card';

    card.innerHTML = `
      <h2></h2>

      <div class="screen"></div>

      <div class="controls"></div>

      <form>
        <input
          type="text"
          placeholder="Код из предыдущего видео"
          autocomplete="off"
          aria-label="Кодовое слово"
          required
        >
        <button type="submit">Открыть</button>
      </form>

      <p
        class="status"
        role="status"
        aria-live="polite"
      ></p>
    `;

    grid.append(card);

    const title = card.querySelector('h2');
    const screen = card.querySelector('.screen');
    const controls = card.querySelector('.controls');
    const form = card.querySelector('form');
    const input = form.querySelector('input');
    const submit = form.querySelector('button');
    const status = card.querySelector('.status');

    title.textContent = lesson.title;

    // Никакой блокировки ввода.
    input.disabled = false;
    input.readOnly = false;
    submit.disabled = false;

    input.style.pointerEvents = 'auto';
    input.style.userSelect = 'text';
    input.style.opacity = '1';
    submit.style.pointerEvents = 'auto';
    submit.style.opacity = '1';

    // Первое видео открыто — поле под ним не требуется.
    if (index === 0) {
      form.remove();
    }

    let video = null;

    function updateCard() {
      const isUnlocked = index <= unlockedIndex;

      if (isUnlocked) {
        showPlayButton();
      } else {
        screen.innerHTML = `
          <div
            class="lock"
            role="img"
            aria-label="Видео заблокировано"
          ></div>
        `;
      }

      status.classList.toggle('done', isUnlocked);

      if (index === 0) {
        status.textContent = 'Видео доступно для просмотра.';
      } else if (isUnlocked) {
        status.textContent = 'Видео открыто.';
      } else {
        status.textContent =
          'Для открытия введите слово из видео «' +
          lessons[index - 1].title +
          '».';
      }
    }

    function showPlayButton() {
      if (video || screen.querySelector('.launch')) return;

      const button = document.createElement('button');

      button.type = 'button';
      button.className = 'launch';
      button.textContent = '▶';

      button.setAttribute(
        'aria-label',
        'Смотреть: ' + lesson.title
      );

      button.addEventListener('click', mountPlayer);

      screen.replaceChildren(button);
    }

    function mountPlayer() {
      if (video || index > unlockedIndex) return;

      video = document.createElement('video');
      video.src = lesson.src;
      video.preload = 'metadata';
      video.playsInline = true;
      video.controls = false;
      video.disablePictureInPicture = true;

      video.setAttribute('disableremoteplayback', '');
      video.setAttribute(
        'controlslist',
        'nodownload noremoteplayback'
      );

      screen.replaceChildren(video);
      players.push(video);

      controls.innerHTML = `
        <button
          type="button"
          aria-label="Воспроизведение или пауза"
        >
          Смотреть
        </button>

        <label>
          Звук
          <input
            type="range"
            aria-label="Громкость"
            min="0"
            max="1"
            step="0.05"
            value="1"
          >
        </label>

        <select aria-label="Скорость воспроизведения">
          <option value="0.75">0,75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1,25×</option>
          <option value="1.5">1,5×</option>
          <option value="2">2×</option>
        </select>
      `;

      const playButton = controls.querySelector('button');
      const volume = controls.querySelector('input');
      const speed = controls.querySelector('select');

      let allowedTime = 0;
      let correctingSeek = false;
      let lastUpdate = performance.now();

      function play() {
        if (video.ended) {
          allowedTime = 0;
          correctingSeek = true;
          video.currentTime = 0;
        }

        lastUpdate = performance.now();

        video.play().catch(() => {
          status.textContent =
            'Не удалось запустить видео. Проверьте файл: ' +
            lesson.src;
        });
      }

      function togglePlayback() {
        if (video.paused) {
          play();
        } else {
          video.pause();
        }
      }

      playButton.addEventListener('click', togglePlayback);
      video.addEventListener('click', togglePlayback);

      volume.addEventListener('input', () => {
        video.volume = Number(volume.value);
      });

      speed.addEventListener('change', () => {
        video.playbackRate = Number(speed.value);
        lastUpdate = performance.now();
      });

      video.addEventListener('play', () => {
        players.forEach((otherVideo) => {
          if (otherVideo !== video) {
            otherVideo.pause();
          }
        });

        playButton.textContent = 'Пауза';
        lastUpdate = performance.now();
      });

      video.addEventListener('pause', () => {
        playButton.textContent = 'Смотреть';
      });

      video.addEventListener('contextmenu', (event) => {
        event.preventDefault();
      });

      // Перемотка не предоставляется в интерфейсе.
      // Попытки изменить позицию возвращают видео назад.
      video.addEventListener('seeking', () => {
        if (
          !correctingSeek &&
          Math.abs(video.currentTime - allowedTime) > 0.35
        ) {
          correctingSeek = true;
          video.currentTime = allowedTime;
        }
      });

      video.addEventListener('seeked', () => {
        correctingSeek = false;
        lastUpdate = performance.now();
      });

      video.addEventListener('timeupdate', () => {
        const now = performance.now();
        const elapsed = (now - lastUpdate) / 1000;

        lastUpdate = now;

        if (correctingSeek || video.seeking) return;

        const expectedMaximum =
          allowedTime + elapsed * video.playbackRate + 0.7;

        if (video.currentTime > expectedMaximum) {
          correctingSeek = true;
          video.currentTime = allowedTime;
          return;
        }

        allowedTime = Math.max(
          allowedTime,
          video.currentTime
        );
      });

      video.addEventListener('ended', () => {
        playButton.textContent = 'Смотреть';

        // Окончание просмотра не открывает другие видео.
        if (
          index === unlockedIndex &&
          index < lessons.length - 1
        ) {
          status.textContent =
            'Введите слово из этого видео в поле под следующим.';
        }
      });

      video.addEventListener('error', () => {
        status.textContent =
          'Видео не найдено или формат не поддерживается: ' +
          lesson.src;
      });

      play();
    }

    if (index > 0) {
      form.addEventListener('submit', (event) => {
        event.preventDefault();

        if (index <= unlockedIndex) {
          status.textContent = 'Это видео уже открыто.';
          return;
        }

        // Ввод доступен везде, но уроки открываются по порядку.
        if (index > unlockedIndex + 1) {
          status.textContent =
            'Сначала откройте предыдущее видео.';
          return;
        }

        // Слово из предыдущего видео открывает текущее.
        const expectedCode = normalize(
          lessons[index - 1].code
        );

        const enteredCode = normalize(input.value);

        if (!expectedCode) {
          status.textContent =
            'Не настроено кодовое слово предыдущего видео.';
          return;
        }

        if (enteredCode !== expectedCode) {
          status.textContent =
            'Неверное кодовое слово. Попробуйте ещё раз.';
          input.focus();
          return;
        }

        unlockedIndex = index;
        saveProgress();

        input.value = '';

        cards.forEach((item) => item.update());
      });
    }

    cards.push({ update: updateCard });
  });

  cards.forEach((card) => card.update());
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initCourse, {
    once: true
  });
} else {
  initCourse();
}
</script>
